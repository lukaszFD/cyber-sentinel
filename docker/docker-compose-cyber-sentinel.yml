# ============================================================
# Cyber Sentinel — Docker Compose Stack Definition
# ============================================================
# Purpose:    Defines all services that make up the Cyber Sentinel
#             stack: DNS layer (Unbound, Pi-hole, passive DNS),
#             automation (n8n), data store (Postgres — the only
#             database), observability (Grafana, Prometheus,
#             node_exporter), secret management (HashiCorp Vault),
#             and admin UIs (Portainer, Firefox, AI config editor).
#
# Started by: Playbook 04.2 with `docker compose up --build -d`
#             (rendered by 04.1 with `template` — {{ domain_suffix }}
#             is Jinja2, ${VAR} is left for docker compose).
#             Project name pinned to "cyber-sentinel" so container
#             names are predictable (referenced as bare names by
#             playbooks 04.3 – 04.6 and 06.1).
#
# Network:    All services attach to a single bridge network
#             `internal_network` (10.10.10.0/24) with static IPs.
#             This convention lets playbooks and Nginx use IPs
#             instead of DNS names where convenient.
#
#             IP allocation:
#               .2  unbound              .9  postgres_db
#               .3  passive_dns          .10 portainer
#               .4  pihole (DNS)         .11 grafana
#               .5  firefox              .12 vault
#               .6  dns_log_processor    .13 prometheus
#               .7  n8n                  .14 node_exporter
#               .8  ai-config-ui         .15 vault_unsealer (disabled)
#               .100 nginx-proxy (created by playbook 05)
#
# Env vars:   ${VAR} placeholders are resolved from the .env file
#             at {{ remote_deploy_base }}/.env (rendered by playbook 01
#             from templates/env.j2).
#
# Image pinning:
#             Registry images come from `cs_images` in
#             group_vars/all/images.yml (single source of truth,
#             shared with playbook 05 for nginx-proxy). Each entry is
#             `repo:tag@sha256:digest`; the digest is authoritative.
#             Locally built services (passive_dns, dns_log_processor,
#             postgres_db, ai-config-ui) are pinned via the FROM line
#             in their Dockerfiles, not here.
#
# KNOWN ISSUES (deferred — do not silently fix during this pass):
#
#   * pihole.volumes use './pihole' and './dnsmasq.d' (no "config/"
#     prefix), but playbook 04.1 creates 'config/dns/dnsmasq.d/'
#     under remote_deploy_base. These paths are inconsistent — one
#     of the two layouts is wrong. Verify by checking where
#     /etc/pihole/gravity.db actually lives on a deployed host.

# ============================================================

services:

  # ------------------------------------------------------------
  # [SVC.DNS.RECURSIVE] Unbound — recursive DNS resolver
  # ------------------------------------------------------------
  # Acts as the upstream resolver for Pi-hole. Doing recursive
  # resolution locally avoids leaking DNS queries to public
  # resolvers (Google, Cloudflare). Pi-hole forwards uncached
  # queries here on port 53 internal.
  # ------------------------------------------------------------
  unbound:
    image: "{{ cs_images.unbound }}"
    container_name: unbound
    hostname: unbound
    networks:
      internal_network:
        ipv4_address: 10.10.10.2
    volumes:
      - './config/unbound/unbound.conf:/etc/unbound/unbound.conf'
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.DNS.PASSIVE] passive_dns — sniffer for IoC harvesting
  # ------------------------------------------------------------
  # Custom dnsmasq build that logs every query/response to a file
  # which dns_log_processor then parses and feeds into Postgres. This
  # is the data source for the threat intelligence pipeline — every
  # IoC analyzed by the AI agent originates here.
  #
  # The custom command flags:
  #   -k                 → keep-foreground (Docker-friendly)
  #   --no-resolv        → ignore /etc/resolv.conf
  #   --server=10.10.10.2 → forward to Unbound
  #   --log-queries      → log every DNS query
  #   --log-facility     → write to mounted volume so other
  #                        containers can read it
  # ------------------------------------------------------------
  passive_dns:
    build:
      context: .
      dockerfile: Dockerfile.pdns
    container_name: passive_dns
    hostname: passive_dns
    networks:
      internal_network:
        ipv4_address: 10.10.10.3
    volumes:
      - './config/dns/dnsmasq.d:/etc/dnsmasq.d'
      - './config/dns/var-log:/var/log'
    restart: unless-stopped
    command: ["dnsmasq", "-k", "--no-resolv", "--server=10.10.10.2#53", "--log-queries", "--log-facility=/var/log/dns.log"]

  # ------------------------------------------------------------
  # [SVC.DNS.AD_BLOCK] Pi-hole — DNS-level ad/threat blocking
  # ------------------------------------------------------------
  # Public DNS server (53/tcp + 53/udp on the host). Adlists are
  # populated by playbook 04.6 [04.6.2.4]. Upstream is set to
  # passive_dns by [04.6.2.3] (pihole -> passive_dns -> unbound).
  # ------------------------------------------------------------
  # KNOWN ISSUE: volume paths './pihole' and './dnsmasq.d' lack
  # the "config/" prefix used elsewhere in the layout — see file
  # header for details.
  pihole:
    image: "{{ cs_images.pihole }}"
    container_name: pihole
    networks:
      internal_network:
        ipv4_address: 10.10.10.4
    environment:
      TZ: "Europe/Warsaw"
    volumes:
      - './pihole:/etc/pihole'
      - './dnsmasq.d:/etc/dnsmasq.d'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    restart: unless-stopped
    depends_on:
      - unbound
      - passive_dns

  # ------------------------------------------------------------
  # [SVC.UI.BROWSER] Firefox — admin browser
  # ------------------------------------------------------------
  # Containerized Firefox accessible over web (LinuxServer.io
  # build). Lets the operator hit internal-only URLs (Portainer,
  # Grafana, Vault UI) without exposing them to the host network.
  # tmpfs:/config makes the browser stateless — no profile lingers.
  # ------------------------------------------------------------
  firefox:
    image: "{{ cs_images.firefox }}"
    container_name: firefox
    hostname: firefox
    tmpfs:
      - /config
    networks:
      internal_network:
        ipv4_address: 10.10.10.5
    dns: 10.10.10.4
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - FIREFOX_CLI=https://www.linuxserver.io/
    security_opt:
      - seccomp=unconfined
    shm_size: 2gb
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.DNS.PROCESSOR] dns_log_processor — log → Postgres pipeline
  # ------------------------------------------------------------
  # Tails the dnsmasq log file and inserts parsed records into
  # cyber_sentinel.dns_queries. This is the bridge between
  # passive_dns (which writes flat logs) and the schema that the
  # AI agent and Grafana consume. Read-only mount on the log
  # file because this container should never write to it.
  # ------------------------------------------------------------
  dns_log_processor:
    build:
      context: .
      dockerfile: Dockerfile.log_processor
    container_name: dns_log_processor
    depends_on:
      - postgres_db
    networks:
      internal_network:
        ipv4_address: 10.10.10.6
    dns: 10.10.10.4
    env_file:
      - .env
    volumes:
      - './config/dns/var-log:/var/log/dns:ro'
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.AUTOMATION] n8n — workflow automation engine
  # ------------------------------------------------------------
  n8n:
    image: "{{ cs_images.n8n }}"
    container_name: n8n-server
    networks:
      internal_network:
        ipv4_address: 10.10.10.7
    dns: 10.10.10.4
    ports:
      # Loopback-only: Nginx (playbook 05) reverse-proxies n8n externally
      # via 443. Docker's published-port DNAT bypasses UFW's INPUT rules
      # regardless of allow_ports (well-known Docker+UFW interaction), so
      # a 0.0.0.0 bind here was reachable from the LAN despite UFW —
      # binding to 127.0.0.1 removes the external listener entirely
      # rather than relying on a firewall rule that doesn't actually
      # apply to Docker-published ports. Also closes the window where
      # n8n's /rest/owner/setup (unauthenticated on a fresh instance)
      # was reachable from the network before playbook 04.6 claims it.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    user: "1000:1000"
    environment:
      - N8N_HOST=n8n.{{ domain_suffix }}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.{{ domain_suffix }}/
      - GENERIC_TIMEZONE=Europe/Warsaw
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.DB.POSTGRES] Postgres + pgvector + pg_cron — sole relational DB
  # ------------------------------------------------------------
  postgres_db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyber_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=cyber_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      internal_network:
        ipv4_address: 10.10.10.9
    dns: 10.10.10.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyber_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------
  # [SVC.UI.AI_CONFIG] ai-config-ui — AI pipeline config editor
  # ------------------------------------------------------------
  # Web UI for the data the n8n AI workflow reads on every run
  # (cyber_sentinel_ai settings, prompt versions, trusted infra,
  # manual allow-list, threat-scale wording). Connects as the
  # dedicated least-privilege role from db_ai_config_editor.sql —
  # never as postgres or the n8n role. Build context is staged by
  # playbook 04.1 [04.1.2.8]; DB role created by playbook 04.5.
  #
  # No `ports:` at all — reachable only through nginx-proxy
  # (playbook 05, `ai_config` entry), so there is no published-port
  # DNAT to bypass UFW (see n8n note above).
  #
  # Only the six AI_UI_* variables are passed in (not env_file:
  # .env) — this container never sees any other stack secret. The
  # VirusTotal / abuse.ch keys power the simulator's live lookups
  # (the same keys n8n uses; the UI keeps its own quota guard).
  #
  # dns: Pi-hole is used for the UI's own outbound lookups (API
  # hosts). Simulated domains are resolved straight against Unbound
  # (AI_UI_RESOLVER) so they never reach passive_dns / dns_queries.
  # ------------------------------------------------------------
  ai-config-ui:
    build:
      context: ./ai_config_ui
      dockerfile: Dockerfile
    image: cyber-sentinel/ai-config-ui:local
    container_name: ai-config-ui
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      internal_network:
        ipv4_address: 10.10.10.8
    dns: 10.10.10.4
    environment:
      AI_UI_DB_HOST: postgres_db
      AI_UI_DB_PORT: "5432"
      AI_UI_DB_NAME: cyber_intelligence
      AI_UI_DB_USER: ${AI_UI_DB_USER}
      AI_UI_DB_PASSWORD: ${AI_UI_DB_PASSWORD}
      AI_UI_SECRET_KEY: ${AI_UI_SECRET_KEY}
      AI_UI_USERS: ${AI_UI_USERS}
      AI_UI_VT_API_KEY: ${AI_UI_VT_API_KEY}
      AI_UI_ABUSE_API_KEY: ${AI_UI_ABUSE_API_KEY}
      AI_UI_RESOLVER: 10.10.10.2
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.UI.PORTAINER] Portainer — Docker management UI
  # ------------------------------------------------------------
  # Web UI for inspecting containers, logs, networks, and volumes.
  # Mounting docker.sock gives Portainer full control over the
  # Docker daemon. Owner account is initialized by playbook 04.6
  # [04.6.3.4] via the REST API.
  # ------------------------------------------------------------
  portainer:
    image: "{{ cs_images.portainer }}"
    container_name: portainer
    hostname: portainer
    networks:
      internal_network:
        ipv4_address: 10.10.10.10
    dns: 10.10.10.4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.OBSERVE.GRAFANA] Grafana — dashboards and alerts
  # ------------------------------------------------------------
  # Renders the threat intelligence dashboards backed by the
  # cyber_sentinel.v_grafana_* views. Provisioning files
  # (datasources, dashboards) are copied by playbook 04.1
  # [04.1.3.3] and [04.1.3.4].
  # ------------------------------------------------------------
  grafana:
    image: "{{ cs_images.grafana }}"
    container_name: grafana
    networks:
      internal_network:
        ipv4_address: 10.10.10.11
    dns: 10.10.10.4
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - './config/grafana/provisioning:/etc/grafana/provisioning'
      - './config/grafana/dashboards:/etc/grafana/dashboards'
      - 'grafana_data:/var/lib/grafana'
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.SECRETS] HashiCorp Vault — secret store
  # ------------------------------------------------------------
  # File-backend Vault used by n8n workflows to fetch CTI API
  # tokens at runtime. Initialized, unsealed, and provisioned by
  # playbook 06.1. IPC_LOCK capability prevents Vault's secrets
  # from being swapped to disk.
  #
  # Why VAULT_LOCAL_CONFIG inline JSON (not a config file): keeps
  # bootstrap simple — no separate vault.hcl to mount. The actual
  # data lives at /vault/file (mounted from ./config/vault/data,
  # owned by UID 100 — see playbook 04.1 [04.1.4.2]).
  # ------------------------------------------------------------
  vault:
    image: "{{ cs_images.vault }}"
    container_name: hashicorp_vault
    ports:
      # Loopback-only — same rationale as n8n above. Vault is also
      # reverse-proxied externally via Nginx (playbook 05,
      # hashicorp_vault service entry). Playbook 06.1 calls this port
      # directly over HTTP as http://127.0.0.1:8200 from tasks that
      # run ON this host (no delegate_to), so loopback-only doesn't
      # break provisioning — it just stops 8200 from being reachable
      # off-host outside of Nginx's TLS-terminated proxy.
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": 1}}}'
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_UI: "true"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config/vault/data:/vault/file
      - ./config/vault/config:/vault/config
    command: server
    networks:
      internal_network:
        ipv4_address: 10.10.10.12
    dns: 10.10.10.4
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.OBSERVE.PROMETHEUS] Prometheus — metrics scraper
  # ------------------------------------------------------------
  # Scrapes node_exporter (system metrics) and any other
  # configured targets (see config/prometheus/prometheus.yml).
  # Used by Grafana as a datasource alongside Postgres.
  # ------------------------------------------------------------
  prometheus:
    image: "{{ cs_images.prometheus }}"
    container_name: prometheus
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      internal_network:
        ipv4_address: 10.10.10.13
    dns: 10.10.10.4
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.OBSERVE.NODE_EXPORTER] Node Exporter — host metrics
  # ------------------------------------------------------------
  # Exposes host-level metrics (CPU, RAM, disk, network) to
  # Prometheus. Read-only mounts on /proc, /sys, /rootfs let the
  # exporter introspect the host from inside its own container
  # without privileged mode.
  # ------------------------------------------------------------
  node_exporter:
    image: "{{ cs_images.node_exporter }}"
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Textfile collector — feeds NVMe SMART metrics generated
      # on the host by playbook 07 (cron, every
      # 5 min). Read-only from the container's side; the host-side
      # script is the only writer.
      - /opt/cyber-sentinel/monitoring/textfile_collector:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'
    networks:
      internal_network:
        ipv4_address: 10.10.10.14
    dns: 10.10.10.4
    restart: unless-stopped

  # ------------------------------------------------------------
  # [SVC.SECRETS.UNSEALER] vault_unsealer — auto-unseal helper
  # ------------------------------------------------------------
  # DISABLED — kept commented out for reference. When enabled,
  # this container reads three unseal keys baked into the image
  # at build time and unseals Vault on every restart. Currently
  # unsealing is handled by playbook 06.1.
  #
  # Playbook 04.1 [04.1.2.6] / [04.1.2.7] still stage
  # Dockerfile.unsealer and unsealer.py, so re-enabling this
  # block needs no playbook change.
  # ------------------------------------------------------------
  #  vault_unsealer:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile.unsealer
  #      args:
  #        - V_KEY1=${VAULT_KEY1}
  #        - V_KEY2=${VAULT_KEY2}
  #        - V_KEY3=${VAULT_KEY3}
  #    container_name: vault_unsealer
  #    networks:
  #      internal_network:
  #        ipv4_address: 10.10.10.15
  #    restart: unless-stopped
  #    depends_on:
  #      - vault

# ============================================================
# Networks
# ============================================================
# Single bridge network for all services. The fixed /24 subnet
# lets us assign predictable IPs (.2 – .15 stack services, see the
# allocation table in the header; .100 Nginx proxy, playbook 05).
# ============================================================
networks:
  internal_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

# ============================================================
# Volumes
# ============================================================
# Named volumes for stateful services. These persist across
# container recreation; deleting them wipes all data.
#   n8n_data        — workflows, credentials, execution history
#   grafana_data    — dashboards (non-provisioned), users, prefs
#   prometheus_data — TSDB metrics history
#   postgres_data   — cyber_intelligence database files
# ============================================================
volumes:
  n8n_data:
  grafana_data:
  prometheus_data:
  postgres_data: