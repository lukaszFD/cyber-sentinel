# Cyber Sentinel stack. Rendered by playbook 04.1 as a Jinja2 template,
# started by 04.2. ${VAR} comes from .env (playbook 01).
# Images are pinned in group_vars/all/images.yml; built services pin
# their base image in the Dockerfile.
# Network 10.10.10.0/24, static IPs; .100 is nginx-proxy (playbook 05).
# Browser sandbox: sandbox_network 10.10.20.0/24 (internal, no route out)
# + sandbox_egress 10.10.21.0/24 (mitmproxy only). See docs/sandbox.md.

services:

  # [SVC.DNS.RECURSIVE] Unbound — recursive resolver, upstream of Pi-hole
  unbound:
    image: "{{ cs_images.unbound }}"
    container_name: unbound
    hostname: unbound
    networks:
      internal_network:
        ipv4_address: 10.10.10.2
    volumes:
      - './config/unbound/unbound.conf:/etc/unbound/unbound.conf'
    restart: unless-stopped

  # [SVC.DNS.AD_BLOCK] Pi-hole — DNS for the LAN; upstream is Unbound (set by 04.6).
  # Its query log (pihole.log, extraLogging on) is the source of dns_queries:
  # /var/log/pihole is bind-mounted so dns_log_processor can read it.
  # KNOWN ISSUE: './pihole' and './dnsmasq.d' lack the 'config/' prefix
  # used by 04.1 — one of the two layouts is wrong.
  pihole:
    image: "{{ cs_images.pihole }}"
    container_name: pihole
    networks:
      internal_network:
        ipv4_address: 10.10.10.4
    environment:
      TZ: "Europe/Warsaw"
    volumes:
      - './pihole:/etc/pihole'
      - './dnsmasq.d:/etc/dnsmasq.d'
      - './config/pihole/log:/var/log/pihole'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    restart: unless-stopped
    depends_on:
      - unbound

  # [SVC.DNS.PROCESSOR] dns_log_processor — pihole.log → cyber_sentinel.dns_queries
  dns_log_processor:
    build:
      context: .
      dockerfile: Dockerfile.log_processor
    container_name: dns_log_processor
    depends_on:
      - postgres_db
      - pihole
    networks:
      internal_network:
        ipv4_address: 10.10.10.6
    dns: 10.10.10.4
    env_file:
      - .env
    volumes:
      - './config/pihole/log:/var/log/pihole:ro'
    restart: unless-stopped

  # [SVC.AUTOMATION] n8n — runs the AI decision workflow
  n8n:
    image: "{{ cs_images.n8n }}"
    container_name: n8n-server
    networks:
      internal_network:
        ipv4_address: 10.10.10.7
    dns: 10.10.10.4
    ports:
      # Loopback only: Docker-published ports bypass UFW. External access via Nginx.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    user: "1000:1000"
    environment:
      - N8N_HOST=n8n.{{ domain_suffix }}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.{{ domain_suffix }}/
      - GENERIC_TIMEZONE=Europe/Warsaw
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    restart: unless-stopped

  # [SVC.DB.POSTGRES] PostgreSQL 16 + pgvector + pg_cron — the only database
  postgres_db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyber_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=cyber_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      internal_network:
        ipv4_address: 10.10.10.9
    dns: 10.10.10.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyber_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10

  # [SVC.UI.AI_CONFIG] ai-config-ui — AI pipeline settings editor
  # No published port (Nginx only), own least-privilege DB role, only AI_UI_* vars.
  # Simulator lookups resolve via Unbound so they never reach dns_queries.
  ai-config-ui:
    build:
      context: ./ai_config_ui
      dockerfile: Dockerfile
    image: cyber-sentinel/ai-config-ui:local
    container_name: ai-config-ui
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      internal_network:
        ipv4_address: 10.10.10.8
    dns: 10.10.10.4
    environment:
      AI_UI_DB_HOST: postgres_db
      AI_UI_DB_PORT: "5432"
      AI_UI_DB_NAME: cyber_intelligence
      AI_UI_DB_USER: ${AI_UI_DB_USER}
      AI_UI_DB_PASSWORD: ${AI_UI_DB_PASSWORD}
      AI_UI_SECRET_KEY: ${AI_UI_SECRET_KEY}
      AI_UI_USERS: ${AI_UI_USERS}
      AI_UI_VT_API_KEY: ${AI_UI_VT_API_KEY}
      AI_UI_ABUSE_API_KEY: ${AI_UI_ABUSE_API_KEY}
      AI_UI_RESOLVER: 10.10.10.2
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  # [SVC.UI.PORTAINER] Portainer — Docker UI; owner created by 04.6
  portainer:
    image: "{{ cs_images.portainer }}"
    container_name: portainer
    hostname: portainer
    networks:
      internal_network:
        ipv4_address: 10.10.10.10
    dns: 10.10.10.4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    restart: unless-stopped

  # [SVC.OBSERVE.GRAFANA] Grafana — dashboards, provisioned by 04.1
  grafana:
    image: "{{ cs_images.grafana }}"
    container_name: grafana
    networks:
      internal_network:
        ipv4_address: 10.10.10.11
    dns: 10.10.10.4
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - './config/grafana/provisioning:/etc/grafana/provisioning'
      - './config/grafana/dashboards:/etc/grafana/dashboards'
      - 'grafana_data:/var/lib/grafana'
    restart: unless-stopped

  # [SVC.SECRETS] HashiCorp Vault — secrets for n8n; init/unseal by 06.1
  vault:
    image: "{{ cs_images.vault }}"
    container_name: hashicorp_vault
    ports:
      # Loopback only (used by 06.1); external access via Nginx.
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": 1}}}'
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_UI: "true"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config/vault/data:/vault/file
      - ./config/vault/config:/vault/config
    command: server
    networks:
      internal_network:
        ipv4_address: 10.10.10.12
    dns: 10.10.10.4
    restart: unless-stopped

  # [SVC.OBSERVE.PROMETHEUS] Prometheus — scrapes node_exporter
  prometheus:
    image: "{{ cs_images.prometheus }}"
    container_name: prometheus
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      internal_network:
        ipv4_address: 10.10.10.13
    dns: 10.10.10.4
    restart: unless-stopped

  # [SVC.OBSERVE.NODE_EXPORTER] Node Exporter — host metrics
  node_exporter:
    image: "{{ cs_images.node_exporter }}"
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # SSD SMART metrics written by playbook 07
      - /opt/cyber-sentinel/monitoring/textfile_collector:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'
    networks:
      internal_network:
        ipv4_address: 10.10.10.14
    dns: 10.10.10.4
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Browser sandbox — "dirty browsing" whose full URL stream is CTI data.
  # sandbox_network is internal (no route out); the only way out is
  # mitmproxy, which alone sits on sandbox_egress. Post-config (CA trust
  # policy, Pi-hole without adlists, nightly reset) is playbook 04.7.
  # Nothing here touches pihole (.4) or cyber_sentinel.dns_queries.
  # ------------------------------------------------------------------

  # [SVC.SANDBOX.BROWSER] ungoogled-chromium in a web viewer (port 3000,
  # via Nginx as sandbox.<suffix>). No volumes except the read-only
  # managed policy (proxy, mitmproxy CA, WebRTC); profile on tmpfs,
  # recreated by `sandbox-reset` (cron 04:00).
  sandbox-browser:
    image: "{{ cs_images.sandbox_browser }}"
    container_name: sandbox-browser
    hostname: sandbox-browser
    networks:
      sandbox_network:
        ipv4_address: 10.10.20.10
    dns: 10.10.20.3
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - CHROME_CLI=about:blank
    tmpfs:
      - /config
    volumes:
      - './config/sandbox/browser/policies:/etc/chromium/policies/managed:ro'
    security_opt:
      - seccomp=unconfined
    shm_size: 512m
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      - sandbox-mitmproxy

  # [SVC.SANDBOX.PROXY] mitmproxy — the sandbox's single egress. The addon
  # logs every flow to config/sandbox/logs/urls.jsonl and refuses private,
  # loopback and link-local destinations (LAN and the stack stay out of reach).
  sandbox-mitmproxy:
    image: "{{ cs_images.mitmproxy }}"
    container_name: sandbox-mitmproxy
    hostname: sandbox-mitmproxy
    networks:
      sandbox_network:
        ipv4_address: 10.10.20.2
      sandbox_egress:
        ipv4_address: 10.10.21.2
    dns: 10.10.20.3
    command:
      - mitmdump
      - --listen-port=8080
      - --set=ssl_insecure=true
      - --set=stream_large_bodies=20m
      - --set=termlog_verbosity=warn
      - -s
      - /addons/sandbox_logger.py
    environment:
      - SANDBOX_LOG_FILE=/logs/urls.jsonl
      - SANDBOX_LOG_DAYS=14
    volumes:
      - './config/sandbox/mitmproxy:/home/mitmproxy/.mitmproxy'
      - './config/sandbox/addons:/addons:ro'
      - './config/sandbox/logs:/logs'
    mem_limit: 384m
    restart: unless-stopped
    depends_on:
      - sandbox-pihole

  # [SVC.SANDBOX.DNS] Pi-hole for the sandbox only — NO adlists (04.7 keeps
  # gravity empty), upstream Unbound. Also on internal_network (.16) to reach
  # Unbound; port 53 is not published. UI via Nginx as sandbox-dns.<suffix>.
  sandbox-pihole:
    image: "{{ cs_images.pihole }}"
    container_name: sandbox-pihole
    hostname: sandbox-pihole
    networks:
      sandbox_network:
        ipv4_address: 10.10.20.3
      internal_network:
        ipv4_address: 10.10.10.16
    environment:
      TZ: "Europe/Warsaw"
      FTLCONF_dns_upstreams: "10.10.10.2#53"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_queryLogging: "true"
      FTLCONF_misc_extraLogging: "true"
      # One client (mitmproxy) makes all queries; the default limit would cut it off.
      FTLCONF_dns_rateLimit_count: "0"
      FTLCONF_dns_specialDomains_mozillaCanary: "false"
      FTLCONF_dns_specialDomains_iCloudPrivateRelay: "false"
      FTLCONF_dns_specialDomains_designatedResolver: "false"
    volumes:
      - './config/sandbox/pihole/etc:/etc/pihole'
      - './config/sandbox/pihole/log:/var/log/pihole'
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - unbound

  # [SVC.SECRETS.UNSEALER] vault_unsealer — DISABLED; unsealing is done by 06.1
  #  vault_unsealer:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile.unsealer
  #      args:
  #        - V_KEY1=${VAULT_KEY1}
  #        - V_KEY2=${VAULT_KEY2}
  #        - V_KEY3=${VAULT_KEY3}
  #    container_name: vault_unsealer
  #    networks:
  #      internal_network:
  #        ipv4_address: 10.10.10.15
  #    restart: unless-stopped
  #    depends_on:
  #      - vault

networks:
  internal_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
  # Browser sandbox: no route out of this network (internal).
  sandbox_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.20.0/24
  # Only mitmproxy is attached: the sandbox's single way to the internet.
  sandbox_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.21.0/24

volumes:
  n8n_data:
  grafana_data:
  prometheus_data:
  postgres_data: