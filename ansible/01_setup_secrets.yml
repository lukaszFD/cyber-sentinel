---
# ============================================================
# Cyber Sentinel — Playbook 01 — Secret & Environment Management
# ============================================================
# Purpose:    Generates the .env file on the remote host from a Jinja2
#             template, populated with secrets decrypted from the local
#             ansible-vault group_vars. This .env is consumed by docker
#             compose in playbook 04.2.
#
# Depends on: - templates/env.j2 must exist locally
#             - group_vars/all/vault.yml must contain all secret values
#               referenced by env.j2 AND by required_vars below
#             - .vault_pass file (or --ask-vault-pass) for decryption
#
# Outputs:    {{ remote_deploy_base }}/.env — owned by deployment_user,
#             permissions 0600 (secrets must not be world-readable).
#
# Section 0 validates every variable env.j2 actually references
# before rendering, so a missing var fails loudly here instead of
# silently landing in .env as an empty string (Ansible's template
# module does not fail on undefined Jinja2 vars by default).
# ============================================================

- name: 01 - Secret & Environment Management
  hosts: all_servers
  become: yes
  become_method: sudo

  vars:
    remote_env_file: "{{ remote_deploy_base }}/.env"

    # Mirrors every {{ var }} referenced in templates/env.j2, in the
    # same order. Not all are vault_-prefixed — mongodb_username,
    # mysql_host, mysql_user, and mysql_database are plain group_vars,
    # not encrypted secrets, but env.j2 breaks the same way if they're
    # undefined, so they're checked here too.
    required_vars:
      - vault_mongodb_password
      - mongodb_username
      - mysql_host
      - mysql_user
      - vault_mysql_password
      - mysql_database
      - vault_mysql_root_password
      - vault_grafana_password
      - vault_root_token
      - vault_unseal_keys
      - vault_webui_secret_key
      - webui_admin_email
      - vault_webui_admin_password
      - webui_admin_name

  tasks:
    # ============================================================
    # SECTION 0 — Required variable validation
    # ============================================================

    - name: "[01.0.1] Assert all variables required by env.j2 are defined and non-empty"
      ansible.builtin.assert:
        that:
          - lookup('vars', item) is defined
          - lookup('vars', item) | length > 0
        fail_msg: "Required variable '{{ item }}' (referenced by templates/env.j2) is missing or empty."
      loop: "{{ required_vars }}"

    # env.j2 indexes vault_unseal_keys[0..2] directly — a list with
    # fewer than 3 entries passes the generic non-empty check above
    # but still breaks the template with an index error.
    - name: "[01.0.2] Assert vault_unseal_keys has at least 3 entries"
      ansible.builtin.assert:
        that:
          - vault_unseal_keys | length >= 3
        fail_msg: "vault_unseal_keys has {{ vault_unseal_keys | length }} entries; env.j2 requires at least 3 (indices 0-2)."

    # ============================================================
    # SECTION 1 — Deployment directory & .env generation
    # ------------------------------------------------------------
    # Ensures the base directory exists with correct ownership before
    # rendering the .env template. Without this, the template task
    # would fail on first run with "destination does not exist".
    # ============================================================

    - name: "[01.1.1] Create base deployment directory if it doesn't exist"
      ansible.builtin.file:
        path: "{{ remote_deploy_base }}"
        state: directory
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0755'

    # Renders env.j2 with all {{ vault_* }} references substituted.
    # Mode 0600 is mandatory — this file contains all stack passwords
    # and API tokens used by docker compose at container startup.
    - name: "[01.1.2] Generate .env from template with decrypted secrets"
      ansible.builtin.template:
        src: "templates/env.j2"
        dest: "{{ remote_env_file }}"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0600'