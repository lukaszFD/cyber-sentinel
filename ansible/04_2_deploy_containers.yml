---
# ============================================================
# Cyber Sentinel — Playbook 04.2 — Deploy Docker Stack
# ============================================================
# Purpose:    Builds custom images and starts the entire Cyber Sentinel
#             container stack via `docker compose up --build -d`.
#             This is intentionally a thin playbook — all staging
#             happens in playbook 04.1, database provisioning in 04.3,
#             post-deployment tweaks in 04.6.
#
# Depends on: - Playbook 04.1 completed (compose file, Dockerfiles,
#               build contexts and configs present at remote_deploy_base)
#             - Playbook 03 (Docker Engine + Compose plugin installed,
#               deployment_user in docker group)
#             - Playbook 01 (.env present — compose resolves ${VAR}
#               placeholders from it)
#
# Outputs:    All containers from docker-compose-cyber-sentinel.yml
#             running in detached mode. The `--build` flag rebuilds the
#             custom images (postgres_db, dns_log_processor,
#             ai-config-ui) on every run, picking up Dockerfile or
#             source changes.
#
# ============================================================

- name: 04.2 - Deploy Docker stack
  hosts: all_servers
  become: yes

  vars:
    project_name: "cyber-sentinel"
    docker_compose_file_name: "docker-compose-cyber-sentinel.yml"

  tasks:
    # ============================================================
    # SECTION 1 — Build and start the stack
    # ============================================================

    # passive_dns and firefox (replaced by the browser sandbox, 04.7) were
    # removed from the compose file; `up` would leave the old containers
    # running as orphans. Removed by name, not with --remove-orphans, so
    # nothing else in the project is touched.
    - name: "[04.2.1.0] Remove retired containers (passive_dns, firefox)"
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - passive_dns
        - firefox

    - name: "[04.2.1.1] Pull, build and start Sentinel stack (detached)"
      ansible.builtin.shell:
        cmd: "docker compose -f {{ docker_compose_file_name }} -p {{ project_name }} up --build -d"
        chdir: "{{ remote_deploy_base }}"
      register: deploy_output
