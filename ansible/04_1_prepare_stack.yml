---
# ============================================================
# Cyber Sentinel — Playbook 04.1 — Prepare Sentinel Stack
# ============================================================
# Purpose:    Stages all configuration files, Dockerfiles, scripts,
#             and build contexts on the remote host BEFORE the
#             docker compose run in playbook 04.2. This is purely
#             a file-copy / directory-creation playbook — no
#             services are started here.
#
# Depends on: - Playbook 03 (Docker installed, deployment_user in group)
#             - Playbook 01 (.env file exists at remote_deploy_base)
#             - Source files present under main_repo_source_dir on
#               the Ansible control host (config/*, docker/*).
#
# Outputs:    Fully populated {{ remote_deploy_base }} tree containing:
#               - docker-compose YAML (rendered — contains Jinja2)
#               - Dockerfiles for custom images (postgres, pdns,
#                 log_processor, vault unsealer)
#               - ai_config_ui/ build context (AI config editor)
#               - Service configs (unbound, prometheus, grafana)
#               - Pre-created log file with permissive ownership for DNS container
#               - Vault data directory with correct UID:GID
#
# ============================================================

- name: 04.1 - Prepare Sentinel Stack environment
  hosts: all_servers
  become: yes

  vars:
    docker_compose_file_name: "docker-compose-cyber-sentinel.yml"

    # Required by docker-compose-cyber-sentinel.yml's Jinja2
    # ({{ domain_suffix }} in the n8n service block). Must stay
    # identical to the definition in 05_deploy_proxy.yml — both
    # need the same value for the same host, since 05 sets Nginx's
    # server_name using this and 04.1 sets n8n's own idea of its
    # hostname from it.
    domain_suffix: "{{ 'local' if inventory_hostname in groups['vm-prox-dev'] else 'prod' }}"

    source_docker_compose_file: "{{ main_repo_source_dir }}/docker/{{ docker_compose_file_name }}"
    remote_docker_compose_file: "{{ remote_deploy_base }}/{{ docker_compose_file_name }}"

  tasks:
    # ============================================================
    # SECTION 1 — Directory tree
    # ------------------------------------------------------------
    # Single bulk task creates the full directory layout under
    # remote_deploy_base. Done up front so subsequent file copy
    # tasks can land into pre-existing destinations without each
    # task needing to call file: state=directory first.
    # ============================================================

    - name: "[04.1.1.1] Create required directories"
      ansible.builtin.file:
        path: "{{ remote_deploy_base }}/{{ item }}"
        state: directory
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0755'
      loop:
        - "config/prometheus"                          # Prometheus scrape config
        - "config/nginx/conf.d"                        # Nginx server blocks (populated in 05)
        - "config/nginx/certs"                         # TLS certs (populated in 05)
        - "config/nginx/html"                          # Static error pages
        - "config/postgres"                            # Postgres init scripts (rendered in 04.3)
        - "config/unbound"                             # Recursive DNS resolver config
        - "config/dns/dnsmasq.d"                       # Pi-hole local DNS overrides
        - "config/dns/var-log"                         # Passive DNS log volume
        - "portainer_data"                             # Portainer state volume
        - "n8n_data"                                   # n8n workflows + credentials volume
        - "config/vault/data"                          # Vault file-backend storage (UID 100)
        - "config/vault/config"                        # Vault HCL config files
        - "config/grafana/provisioning/datasources"    # Auto-provisioned datasources
        - "config/grafana/provisioning/dashboards"     # Dashboard provisioning manifest
        - "config/grafana/dashboards"                  # Actual dashboard JSON files
        - "ai_config_ui"                               # AI config editor build context

    # ============================================================
    # SECTION 2 — Stack manifests (docker-compose + build inputs)
    # ------------------------------------------------------------
    # Copies the orchestration manifest and everything that
    # `docker compose up --build` in playbook 04.2 needs to build
    # the custom images. A missing build context here makes 04.2
    # fail for the WHOLE stack, not only for that one service.
    # ============================================================

    # docker-compose-cyber-sentinel.yml contains live Jinja2
    # ({{ domain_suffix }} in the n8n service's N8N_HOST and
    # WEBHOOK_URL). `template` is required here, not `copy` — copy
    # would ship the literal string "{{ domain_suffix }}" to the
    # remote host and break n8n's webhook URL and host header
    # validation. ${VAR} placeholders are left for docker compose.
    - name: "[04.1.2.1] Render docker-compose file (contains Jinja2 for domain_suffix)"
      ansible.builtin.template:
        src: "{{ source_docker_compose_file }}"
        dest: "{{ remote_docker_compose_file }}"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.2.2] Copy Dockerfile for Postgres + pgvector + pg_cron"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/postgres/Dockerfile.postgres"
        dest: "{{ remote_deploy_base }}/Dockerfile.postgres"
        owner: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.2.3] Copy Dockerfile for Passive DNS sniffer"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/dns/Dockerfile.pdns"
        dest: "{{ remote_deploy_base }}/Dockerfile.pdns"
        owner: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.2.4] Copy Dockerfile for DNS log processor"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/dns/Dockerfile.log_processor"
        dest: "{{ remote_deploy_base }}/Dockerfile.log_processor"
        owner: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.2.5] Copy log processor Python script"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/dns/log_processor.py"
        dest: "{{ remote_deploy_base }}/log_processor.py"
        owner: "{{ deployment_user }}"
        mode: '0644'

    # vault_unsealer is disabled in docker-compose-cyber-sentinel.yml
    # (commented out, [SVC.SECRETS.UNSEALER]); these two files are staged
    # so re-enabling the service needs no change here.
    - name: "[04.1.2.6] Copy Dockerfile for Vault auto-unsealer"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/hcv/Dockerfile.unsealer"
        dest: "{{ remote_deploy_base }}/Dockerfile.unsealer"
        owner: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.2.7] Copy Vault auto-unsealer Python script"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/hcv/unsealer.py"
        dest: "{{ remote_deploy_base }}/unsealer.py"
        owner: "{{ deployment_user }}"
        mode: '0644'

    # Build context of the ai-config-ui service (compose:
    # build.context ./ai_config_ui). Source only, no secrets — those
    # come from .env at container start. 04.5 re-stages the same tree
    # so it can also be run on its own after a UI code change.
    - name: "[04.1.2.8] Stage AI config editor (ai-config-ui) build context"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/ai_config_ui/"
        dest: "{{ remote_deploy_base }}/ai_config_ui/"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0644'
        directory_mode: '0755'

    # ============================================================
    # SECTION 3 — Service configuration files
    # ------------------------------------------------------------
    # Copies static config for Unbound (recursive DNS), Prometheus
    # scrape targets, and Grafana provisioning. Grafana dashboards
    # land in two places intentionally — see [04.1.3.4].
    # ============================================================

    - name: "[04.1.3.1] Copy Unbound DNS resolver configuration"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/unbound/unbound.conf"
        dest: "{{ remote_deploy_base }}/config/unbound/unbound.conf"
        owner: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.3.2] Copy Prometheus scrape configuration"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/prometheus/prometheus.yml"
        dest: "{{ remote_deploy_base }}/config/prometheus/prometheus.yml"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0644'

    - name: "[04.1.3.3] Copy Grafana provisioning tree (datasources + manifests)"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/grafana/provisioning/"
        dest: "{{ remote_deploy_base }}/config/grafana/provisioning/"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0644'
        directory_mode: '0755'

    - name: "[04.1.3.4] Copy dashboard JSONs to Grafana's runtime path"
      ansible.builtin.copy:
        src: "{{ main_repo_source_dir }}/config/grafana/provisioning/dashboards/"
        dest: "{{ remote_deploy_base }}/config/grafana/dashboards/"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0644'

    # ============================================================
    # SECTION 4 — Container UID/permission fixes
    # ------------------------------------------------------------
    # Two container images (pdns, vault) run as non-root UIDs that
    # don't match deployment_user on the host. Bind-mounted volumes
    # inherit host ownership, so we pre-create files/dirs with the
    # UIDs the containers expect — otherwise they fail at startup
    # with "permission denied" or silently log nothing.
    # ============================================================

    - name: "[04.1.4.1] Pre-create DNS log file with permissive ownership (UID 1000)"
      ansible.builtin.file:
        path: "{{ remote_deploy_base }}/config/dns/var-log/dns.log"
        state: touch
        owner: "1000"
        group: "1000"
        mode: '0666'

    - name: "[04.1.4.2] Set ownership for Vault data directory (UID 100)"
      ansible.builtin.file:
        path: "{{ remote_deploy_base }}/config/vault/data"
        owner: "100"
        group: "1000"
        mode: '0700'