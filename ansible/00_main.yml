---
# ============================================================
# Cyber Sentinel — Playbook 00 — Master Orchestrator
# ============================================================
# Purpose:    Top-level entry point that imports all sub-playbooks in
#             dependency order. Run this to deploy the entire stack.
#
# Depends on: hosts.ini inventory file, group_vars/all/vault.yml decrypted
#             via .vault_pass file (or --ask-vault-pass flag).
#
# Outputs:    Fully provisioned stack: secrets, firewall, system packages,
#             Docker containers, Postgres (schema, partitioning, AI
#             pipeline), Tranco allow-list, AI config editor, post-config
#             (Fail2Ban/Pi-hole/Portainer/n8n), reverse proxy, HashiCorp
#             Vault, n8n credentials, post-deploy image/health check.
#
# Errors:     If any sub-playbook fails, deployment stops at that point.
#             Re-running 00_main.yml is safe — all sub-playbooks are
#             designed to be idempotent.
#
# Not imported (run manually on an already-deployed host):
#             07_setup_monitoring.yml — rpi5-prod hardware health metrics.
#
# Usage:
#   ansible-playbook -i hosts.ini ansible/00_main.yml \
#     --vault-password-file ansible/.vault_pass
# ============================================================

# ------------------------------------------------------------
# [00.0] Stage 0 — Pre-deployment (DEV environment only)
# ------------------------------------------------------------
# 00_1_restore_proxmox.yml has an internal gate that skips the play
# unless --limit includes vm-prox-dev (or no --limit is given).
# Safe to keep here unconditionally — it self-skips for prod.
#
# Placed BEFORE foundation tasks so the dev VM is freshly restored
# before anything touches it. The playbook itself waits for SSH.
# ------------------------------------------------------------
- import_playbook: 00_1_restore_proxmox.yml          # [00.0.1] DEV only — restore VM from latest backup

# ------------------------------------------------------------
# [00.1] Stage 1 — Foundation (secrets + security + system)
# ------------------------------------------------------------
# Must run first. Creates the .env file, configures the firewall, and
# installs Docker + system dependencies. All later playbooks assume
# Docker is available and the firewall is open for the required ports.
# ------------------------------------------------------------
- import_playbook: 01_setup_secrets.yml              # [00.1.1] Render .env on the remote host
- import_playbook: 02_setup_security.yml             # [00.1.2] UFW firewall rules
- import_playbook: 03_setup_system.yml               # [00.1.3] Docker, monitoring tools, RPi cooling

# ------------------------------------------------------------
# [00.2] Stage 2 — Core stack + database
# ------------------------------------------------------------
# 04.1 stages every file the compose build needs, 04.2 builds and
# starts all containers, 04.3 provisions Postgres (the only database
# in the stack). 04.4 and 04.5 depend on 04.3; 04.5 must run AFTER
# 04.3 on every deployment (see its header). 04.6 imports the n8n
# workflow, which reads the AI schema created by 04.3.
# ------------------------------------------------------------
- import_playbook: 04_1_prepare_stack.yml            # [00.2.1] Stage compose file, Dockerfiles, configs, app sources
- import_playbook: 04_2_deploy_containers.yml        # [00.2.2] docker compose up --build -d
- import_playbook: 04_3_db_postgres.yml              # [00.2.3] Postgres schema, partitioning, AI pipeline schema
- import_playbook: 04_4_tranco_allowlist.yml         # [00.2.4] Tranco allow-list: weekly cron + initial load
- import_playbook: 04_5_ai_config_editor.yml         # [00.2.5] AI config editor: DB role + ai-config-ui
- import_playbook: 04_6_post_config.yml              # [00.2.6] Fail2Ban, Pi-hole, Portainer/n8n owners, workflow import

# ------------------------------------------------------------
# [00.3] Stage 3 — Edge layer (proxy + secret store)
# ------------------------------------------------------------
# Nginx reverse proxy must run AFTER all backend services exist
# (otherwise upstream resolution fails). Vault provisioning runs
# after every component is deployed; 06.2 must follow 06.1 in the
# same run (it reuses the n8n token minted by 06.1).
# ------------------------------------------------------------
- import_playbook: 05_deploy_proxy.yml               # [00.3.1] Nginx reverse proxy with SSL
- import_playbook: 06_1_initialize_provision_vault.yml  # [00.3.2] Init/unseal Vault, provision secrets, n8n token
- import_playbook: 06_2_n8n_bootstrap.yml            # [00.3.3] n8n community nodes + credentials (fixed IDs)
