---
# ============================================================
# Cyber Sentinel — Playbook 06.1 — Vault Init, Unseal & Provision
# ============================================================
# Purpose:    Single idempotent lifecycle playbook for HashiCorp Vault:
#               - first run (uninitialized Vault): initializes it,
#                 unseals with the freshly generated keys, provisions all
#                 secrets, and displays root_token + unseal_keys ONCE
#               - re-run: unseals from group_vars if sealed, re-provisions
#                 secrets with vault_root_token, never re-displays keys
#             In both cases Section 7 maintains a scoped, read-only Vault
#             token for n8n (minted on first run / renewed on re-run);
#             playbook 06.2 imports it into n8n in the same run.
#
# Depends on: - 04.2 (hashicorp_vault container running, port 8200 bound
#               to 127.0.0.1 on the host)
#             - group_vars: every variable in required_vars_always;
#               vault_root_token + vault_unseal_keys on re-runs
#
# Outputs:    - KV v2 engine at secret/, populated under cyber-sentinel/
#               (api-keys/*, certs/*, credentials/*)
#             - ACL policy n8n-readonly + periodic n8n token
#
# Sections:   0 pre-flight · 1 init · 2 unseal · 3 KV engine · 4 API keys
#             5 certificates · 6 credentials · 7 n8n token
#             7b Pi-hole API password · 8 summary
# ============================================================

- name: 06.1 - Vault lifecycle (init + unseal + provision)
  hosts: all_servers
  gather_facts: false

  vars:
    vault_url: "http://127.0.0.1:8200"
    postgres_host: "10.10.10.9"

    # Vars required for re-runs (initialized Vault). Skipped on first run
    # because the freshly generated creds are used instead.
    required_vars_rerun:
      - vault_root_token
      - vault_unseal_keys

    # Vars required in BOTH scenarios (always needed for provisioning)
    required_vars_always:
      - vault_virus_total_token
      - vault_gemini_api_key
      - vault_abuse_api_key
      - vault_grafana_api_key
      - vault_urlscanio_api_key
      - vault_pihole_admin_password
      - vault_grafana_password
      - vault_portainer_password
      - vault_n8n_password
      - vault_postgres_password
      - vault_postgres_root_password
      - vault_n8n_gmail
      - portainer_admin_user
      - n8n_admin_user
      - postgres_user
      - ai_config_db_user
      - vault_ai_config_db_password

    # Cert/key pairs — checked dynamically via lookup
    required_cert_services:
      - pihole
      - n8n
      - grafana

  tasks:

    # ============================================================
    # SECTION 0 — PRE-FLIGHT CHECKS
    # ============================================================

    - name: "[06.1.0.1] Check Vault initialization status"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/init"
        method: GET
      register: vault_init_check

    - name: "[06.1.0.2] Set fact — is Vault already initialized"
      ansible.builtin.set_fact:
        vault_already_initialized: "{{ vault_init_check.json.initialized }}"

    - name: "[06.1.0.3] Verify always-required variables are defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
          - vars[item] | string | length > 0
        fail_msg: "Required variable '{{ item }}' is missing or empty."
        quiet: true
      loop: "{{ required_vars_always }}"

    - name: "[06.1.0.4] Verify re-run variables are defined (only if Vault already initialized)"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
          - vars[item] | string | length > 0
        fail_msg: "Required variable '{{ item }}' is missing. Vault is already initialized; you must provide existing root_token and unseal_keys in group_vars."
        quiet: true
      loop: "{{ required_vars_rerun }}"
      when: vault_already_initialized

    - name: "[06.1.0.5] Verify cert/key pairs exist for each service"
      ansible.builtin.assert:
        that:
          - lookup('vars', 'vault_' + item + '_cert', default='') | length > 0
          - lookup('vars', 'vault_' + item + '_key',  default='') | length > 0
        fail_msg: "Missing cert/key for service '{{ item }}'. Expected vars: vault_{{ item }}_cert and vault_{{ item }}_key."
        quiet: true
      loop: "{{ required_cert_services }}"

    - name: "[06.1.0.6] Pre-flight summary"
      ansible.builtin.debug:
        msg:
          - "Vault host: {{ vault_url }}"
          - "Already initialized: {{ vault_already_initialized }}"
          - "Mode: {{ 'RE-RUN (using existing creds)' if vault_already_initialized else 'FIRST INIT (generating new creds)' }}"

    # ============================================================
    # SECTION 1 — INITIALIZE (only if Vault is fresh)
    # ============================================================

    - name: "[06.1.1.1] Initialize Vault (generates root_token + unseal_keys)"
      ansible.builtin.shell:
        cmd: "docker exec hashicorp_vault vault operator init -format=json"
      register: vault_init_raw
      when: not vault_already_initialized
      changed_when: vault_init_raw.rc == 0

    - name: "[06.1.1.2] Parse newly generated credentials"
      ansible.builtin.set_fact:
        vault_creds: "{{ vault_init_raw.stdout | from_json }}"
      when: not vault_already_initialized
      no_log: true

    # Unified token used by all subsequent tasks: either freshly generated
    # (first run) or pulled from group_vars (re-run).
    - name: "[06.1.1.3] Set effective root token for this play"
      ansible.builtin.set_fact:
        effective_root_token: >-
          {{ vault_creds.root_token if not vault_already_initialized
             else vault_root_token | trim }}
      no_log: true

    # ============================================================
    # SECTION 2 — UNSEAL
    # ============================================================

    - name: "[06.1.2.1] Re-check Vault health (after potential init)"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/health"
        status_code: [200, 429, 501, 503]
      register: vault_health

    - name: "[06.1.2.2] Auto-unseal using freshly generated keys (first run)"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/unseal"
        method: POST
        body: { key: "{{ item }}" }
        body_format: json
      loop: "{{ vault_creds.unseal_keys_b64 }}"
      when:
        - not vault_already_initialized
        - vault_health.status == 503
      no_log: true

    - name: "[06.1.2.3] Auto-unseal using group_vars keys (re-run, if sealed)"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/unseal"
        method: POST
        body: { key: "{{ item }}" }
        body_format: json
      loop: "{{ vault_unseal_keys | default([]) }}"
      when:
        - vault_already_initialized
        - vault_health.status == 503
      no_log: true

    # ============================================================
    # SECTION 3 — ENABLE KV ENGINE
    # ============================================================

    - name: "[06.1.3.1] Ensure KV v2 secrets engine is enabled at /secret"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/mounts/secret"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body: { type: "kv", options: { version: "2" } }
        body_format: json
        status_code: [200, 204, 400]   # 400 = already enabled
      no_log: true

    # ============================================================
    # SECTION 4 — API KEYS
    # ============================================================

    - name: "[06.1.4.1] Provision external API tokens"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/secret/data/cyber-sentinel/api-keys/{{ item.path }}"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body: { data: { token: "{{ item.value }}" } }
        body_format: json
        status_code: [200, 204]
      no_log: true
      loop:
        - { path: "virustotal",                     value: "{{ vault_virus_total_token }}" }
        - { path: "gemini/home-network-guardian",   value: "{{ vault_gemini_api_key }}" }
        - { path: "abuse/api-key",                  value: "{{ vault_abuse_api_key }}" }
        - { path: "grafana/api-key",                value: "{{ vault_grafana_api_key }}" }
        - { path: "urlscanio/api-key",              value: "{{ vault_urlscanio_api_key }}" }

    # ============================================================
    # SECTION 5 — CERTIFICATES
    # ============================================================

    - name: "[06.1.5.1] Provision TLS certs/keys for services"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/secret/data/cyber-sentinel/certs/{{ item }}"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body:
          data:
            cert: "{{ lookup('vars', 'vault_' + item + '_cert') }}"
            key:  "{{ lookup('vars', 'vault_' + item + '_key') }}"
        body_format: json
        status_code: [200, 204]
      loop: "{{ required_cert_services }}"
      no_log: true

    # ============================================================
    # SECTION 6 — APP & DATABASE CREDENTIALS
    # ============================================================

    - name: "[06.1.6.1] Provision application and database credentials"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/secret/data/cyber-sentinel/credentials/{{ item.path }}"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body:
          data:
            user: "{{ item.user | default('admin') }}"
            password: "{{ item.value }}"
        body_format: json
        status_code: [200, 204]
      no_log: true
      loop:
        # App passwords
        - { path: "pihole",            value: "{{ vault_pihole_admin_password }}" }
        - { path: "grafana",           value: "{{ vault_grafana_password }}" }
        - { path: "portainer",         value: "{{ vault_portainer_password }}", user: "{{ portainer_admin_user }}" }
        - { path: "n8n",               value: "{{ vault_n8n_password }}",       user: "{{ n8n_admin_user }}" }
        # Database roots
        - { path: "postgres/root",        value: "{{ vault_postgres_root_password }}", user: "postgres" }
        - { path: "postgres/app_manager", value: "{{ vault_postgres_password }}",       user: "{{ postgres_user }}" }
        - { path: "postgres/ai_config_editor", value: "{{ vault_ai_config_db_password }}", user: "{{ ai_config_db_user }}" }
        # Email
        - { path: "gmail",   value: "{{ vault_n8n_gmail }}",           user: "{{ vault_n8n_user }}" }

    # ============================================================
    # SECTION 7 — N8N READ-ONLY TOKEN (LEAST PRIVILEGE)
    # ------------------------------------------------------------
    # n8n previously authenticated to Vault using vault_root_token —
    # full admin access to every secret, cert, and Vault's own
    # storage backend, from inside a workflow engine that executes
    # AI-agent-driven, internet-facing HTTP requests. This stage
    # replaces that with a dedicated Vault ACL policy + token,
    # scoped to READ-ONLY on exactly the paths the n8n workflow
    # actually consumes (see the HashiCorp Vault node secretPath
    # values in config/n8n/workflows/*.json — keep this policy in
    # sync if those change).
    #
    # Deliberately NOT included (n8n never reads these at runtime):
    #   - certs/*                      (Nginx-only, staged by playbook 05)
    #   - credentials/postgres/root    (Ansible-only, playbook 04.3)
    #   - credentials/postgres/ai_config_editor (AI config editor only)
    #   - credentials/pihole|grafana|portainer|n8n
    #     (admin UI passwords, consumed by Ansible in 04.6, not n8n).
    #     n8n reads credentials/pihole-api instead — a separate Pi-hole
    #     application password (Section 7b), revocable on its own.
    #   - api-keys/grafana/*
    #     (consumed by Grafana provisioning, not n8n)
    #
    # api-keys/* is granted as a whole subtree rather than one leaf
    # path per provider — CTI API keys are exactly the class of
    # secret this workflow exists to consume, and a new provider
    # (e.g. urlscan.io, already in dic_source_providers but not yet
    # wired into the workflow) shouldn't require a policy change to
    # start using. Narrow this to exact leaf paths if you want it
    # tighter than that.
    #
    # TOKEN LIFECYCLE:
    #   - Period is 1 year (8760h) by default — chosen so this needs
    #       manual attention once a year, not once a month. There is
    #       still no automatic renewal mechanism (no cron, no n8n
    #       self-renew workflow): "renewal" means someone re-running
    #       this playbook before the period elapses. Track that date
    #       somewhere outside Vault.
    #   - Vault's token auth backend defaults to a 768h (32 day) max
    #       lease TTL, which would silently cap the requested period
    #       regardless of what's asked for — the tune task right
    #       below raises that ceiling first, scoped to the token auth
    #       mount only.
    #   - First run (no vault_n8n_token_accessor in group_vars):
    #       mints a new orphan, periodic token and displays it ONCE
    #       — same "shown once" convention as root_token/unseal_keys
    #       above. Playbook 06.2 loads it into n8n's "HashiCorp Vault
    #       account" credential in the same run. Save the printed
    #       token and accessor as vault_n8n_vault_token and
    #       vault_n8n_token_accessor (ansible-vault, per host) so
    #       future runs renew instead of recreating.
    #   - Re-run (accessor present): RENEWS the existing token via
    #       its accessor instead of minting a new one. Vault only
    #       ever reveals a token's raw value at creation time, so
    #       nothing new is printed on renewal — the token already
    #       configured in n8n keeps working, its period just resets.
    #       This matters: minting a fresh token on every re-run
    #       without revoking the old one would leave old, still-valid
    #       tokens orphaned in Vault indefinitely — the exact class
    #       of problem this stage exists to get away from.
    #   - If renewal fails (accessor stale/revoked, or Vault was
    #       reset), falls back to minting a fresh orphan token and
    #       displays it again — 06.2 picks it up automatically;
    #       update ansible-vault once more.
    #
    # n8n CREDENTIAL: handled by playbook 06.2 (06_2_n8n_bootstrap.yml)
    # via `n8n import:credentials` with a fixed credential ID. It uses
    # the token minted here when one was minted in this run, otherwise
    # vault_n8n_vault_token from ansible-vault.
    # ============================================================

    - name: "[06.1.7.1] Set effective renewal period"
      ansible.builtin.set_fact:
        n8n_token_period: "{{ vault_n8n_token_period | default('8760h') }}"

    # Vault's token auth backend caps every token's period/TTL at its own
    # max_lease_ttl, which defaults to 768h (32 days) — independent of
    # whatever `period` a create-orphan call requests. Without raising
    # this first, a requested 8760h period would be silently truncated
    # to 768h by Vault itself (create-orphan does not error on this —
    # it just grants the capped value), and the "renews once a year"
    # plan below would quietly turn into "renews once a month" again.
    # Scoped to the token auth mount only (auth/token/tune), not the
    # server-wide default_lease_ttl/max_lease_ttl — leaves lease
    # durations for KV secrets and everything else untouched.
    - name: "[06.1.7.2] Raise token auth backend's max lease TTL to allow the configured period"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/auth/token/tune"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body_format: json
        body:
          max_lease_ttl: "{{ n8n_token_period }}"
        status_code: [200, 204]

    - name: "[06.1.7.3] Create/update the n8n read-only ACL policy"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/policies/acl/n8n-readonly"
        method: PUT
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body_format: json
        body:
          policy: |
            path "secret/data/cyber-sentinel/api-keys/*" {
              capabilities = ["read"]
            }

            path "secret/data/cyber-sentinel/credentials/postgres/app_manager" {
              capabilities = ["read"]
            }

            path "secret/data/cyber-sentinel/credentials/gmail/*" {
              capabilities = ["read"]
            }

            # Exact path written by Section 6 ({ path: "gmail" }) and read by
            # the "Vault - SMTP sender" node in workflow v3. The glob above
            # only matches paths BELOW gmail/, never gmail itself.
            path "secret/data/cyber-sentinel/credentials/gmail" {
              capabilities = ["read"]
            }

            # Pi-hole APPLICATION password (Section 7b), used by the
            # workflow's auto-block step. Not the admin password.
            path "secret/data/cyber-sentinel/credentials/pihole-api" {
              capabilities = ["read"]
            }
        status_code: [200, 204]

    - name: "[06.1.7.4] Attempt to renew existing n8n token (re-run path)"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/auth/token/renew-accessor"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body_format: json
        body:
          accessor: "{{ vault_n8n_token_accessor }}"
        status_code: [200, 400, 403]
      register: n8n_token_renew
      when: vault_n8n_token_accessor is defined and vault_n8n_token_accessor | length > 0
      no_log: true

    - name: "[06.1.7.5] Determine whether a new token must be minted"
      ansible.builtin.set_fact:
        n8n_token_needs_creation: >-
          {{ (vault_n8n_token_accessor is not defined) or
             (vault_n8n_token_accessor | length == 0) or
             (n8n_token_renew is defined and n8n_token_renew.status != 200) }}

    - name: "[06.1.7.6] Mint a new orphan, periodic, read-only token for n8n"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/auth/token/create-orphan"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body_format: json
        body:
          policies: ["n8n-readonly"]
          period: "{{ n8n_token_period }}"
          renewable: true
          no_default_policy: true
          display_name: "n8n-readonly"
        status_code: [200]
      register: n8n_token_create
      when: n8n_token_needs_creation
      no_log: true

    - name: "[06.1.7.7] Display newly minted token (SAVE THIS NOW — shown only once)"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  N8N READ-ONLY VAULT TOKEN — SAVE THE FOLLOWING NOW"
          - "============================================================"
          - ""
          - "  Token:    {{ n8n_token_create.json.auth.client_token }}"
          - "  Accessor: {{ n8n_token_create.json.auth.accessor }}"
          - "  Policy:   n8n-readonly (read-only — api-keys/*, "
          - "            credentials/postgres/app_manager, "
          - "            credentials/gmail/*, credentials/pihole-api"
          - "            — see this playbook's"
          - "            Section 7 header for the full rationale)"
          - "  Period:   {{ n8n_token_period }} (~1 year). Renewal is NOT"
          - "            automatic — nothing in this stack runs on a"
          - "            schedule. This token expires unless someone"
          - "            re-runs this playbook (Section 7 renews it via"
          - "            the accessor below) before the period elapses."
          - "            Put a reminder outside Vault for that date —"
          - "            Vault will not warn you before it expires."
          - ""
          - "  n8n: nothing to do — playbook 06.2 imports this token"
          - "       into the 'HashiCorp Vault account' credential"
          - "       automatically in this run."
          - ""
          - "  ACTION REQUIRED (for future renew-only runs):"
          - "    Add to host_vars/{{ inventory_hostname }}/vault.yml (ansible-vault):"
          - "         vault_n8n_vault_token: \"<Token above>\""
          - "         vault_n8n_token_accessor: \"{{ n8n_token_create.json.auth.accessor }}\""
          - "       Without the accessor, every future run mints ANOTHER"
          - "       token and this one is left valid but orphaned in Vault."
          - "  This token value will NEVER be displayed again."
          - "============================================================"
      when: n8n_token_needs_creation

    - name: "[06.1.7.8] Confirm renewal (re-run path, nothing new to display)"
      ansible.builtin.debug:
        msg: "n8n Vault token renewed via accessor {{ vault_n8n_token_accessor }} — still valid, no changes needed in n8n."
      when: not n8n_token_needs_creation

    # ============================================================
    # SECTION 7b — PI-HOLE API APPLICATION PASSWORD (n8n auto-block)
    # ------------------------------------------------------------
    # The workflow's auto-block step adds malicious domains to Pi-hole's
    # denylist through the Pi-hole v6 API. It must not use the admin
    # password (that stays out of n8n — see Section 7). Pi-hole v6 has
    # exactly one "application password": an API credential that is
    # separate from the admin password and can be replaced at any time
    # without touching the admin login.
    #
    #   1. log in with the admin password            POST /api/auth
    #   2. let Pi-hole generate password + hash      GET  /api/auth/app
    #      (this also ends every active session, including ours)
    #   3. activate the hash                         pihole-FTL --config
    #      webserver.api.app_pwhash <hash>   (same CLI pattern as 04.6)
    #   4. store the plain password in Vault         credentials/pihole-api
    #   5. prove it works: log in with it, log out
    #
    # Idempotent: runs only when credentials/pihole-api is missing in
    # Vault, or when forced with -e pihole_api_rotate=true. A rotation
    # needs nothing in n8n — the workflow reads Vault on every run.
    # Pi-hole must be reachable from the host on its bridge IP.
    # ============================================================

    - name: "[06.1.7.9] Check whether the Pi-hole API password is already in Vault"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/secret/data/cyber-sentinel/credentials/pihole-api"
        method: GET
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        status_code: [200, 404]
      register: pihole_api_secret
      no_log: true

    - name: "[06.1.7.10] Decide whether to (re)create the Pi-hole API password"
      ansible.builtin.set_fact:
        pihole_api_needs_creation: "{{ pihole_api_secret.status == 404 or (pihole_api_rotate | default(false) | bool) }}"
        pihole_api_url: "{{ pihole_api_base_url | default('http://10.10.10.4') }}"

    - name: "[06.1.7.11] Log in to the Pi-hole API with the admin password"
      ansible.builtin.uri:
        url: "{{ pihole_api_url }}/api/auth"
        method: POST
        body_format: json
        body:
          password: "{{ vault_pihole_admin_password }}"
        status_code: [200]
      register: pihole_admin_session
      until: pihole_admin_session.status == 200
      retries: 10
      delay: 5
      no_log: true
      when: pihole_api_needs_creation

    - name: "[06.1.7.12] Generate a new Pi-hole application password"
      ansible.builtin.uri:
        url: "{{ pihole_api_url }}/api/auth/app"
        method: GET
        headers:
          X-FTL-SID: "{{ pihole_admin_session.json.session.sid }}"
        status_code: [200]
      register: pihole_app_password
      no_log: true
      when: pihole_api_needs_creation

    # argv (no shell): the BALLOON hash contains '$' characters.
    # become: this play runs unprivileged; only the docker socket needs root.
    - name: "[06.1.7.13] Activate the application password in Pi-hole"
      become: true
      community.docker.docker_container_exec:
        container: pihole
        argv:
          - pihole-FTL
          - --config
          - webserver.api.app_pwhash
          - "{{ pihole_app_password.json.app.hash }}"
      no_log: true
      when: pihole_api_needs_creation

    - name: "[06.1.7.14] Store the Pi-hole application password in Vault"
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/secret/data/cyber-sentinel/credentials/pihole-api"
        method: POST
        headers: { X-Vault-Token: "{{ effective_root_token }}" }
        body_format: json
        body:
          data:
            user: "n8n-autoblock"
            password: "{{ pihole_app_password.json.app.password }}"
        status_code: [200, 204]
      no_log: true
      when: pihole_api_needs_creation

    - name: "[06.1.7.15] Verify the application password can log in"
      ansible.builtin.uri:
        url: "{{ pihole_api_url }}/api/auth"
        method: POST
        body_format: json
        body:
          password: "{{ pihole_app_password.json.app.password }}"
        status_code: [200]
      register: pihole_app_session
      until: pihole_app_session.status == 200
      retries: 5
      delay: 3
      no_log: true
      when: pihole_api_needs_creation

    # Pi-hole allows only a few concurrent sessions — never leave one open.
    - name: "[06.1.7.16] Log out the verification session"
      ansible.builtin.uri:
        url: "{{ pihole_api_url }}/api/auth"
        method: DELETE
        headers:
          X-FTL-SID: "{{ pihole_app_session.json.session.sid }}"
        status_code: [204, 401, 404]
      no_log: true
      when: pihole_api_needs_creation

    - name: "[06.1.7.17] Report Pi-hole API password status"
      ansible.builtin.debug:
        msg: >-
          {{ 'Pi-hole application password created and stored in Vault (credentials/pihole-api).'
             if pihole_api_needs_creation else
             'Pi-hole application password already in Vault — unchanged (rotate with -e pihole_api_rotate=true).' }}

    # ============================================================
    # SECTION 8 — FINAL MESSAGE
    # ============================================================
    # On first init: display creds ONCE so operator can save them manually.
    # On re-run: just confirm success, never re-display anything sensitive.

    - name: "[06.1.8.1] First-init credential display (SAVE THESE NOW — shown only once)"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  VAULT INITIALIZED SUCCESSFULLY — SAVE THE FOLLOWING NOW"
          - "============================================================"
          - ""
          - "  Root Token: {{ vault_creds.root_token }}"
          - ""
          - "  Unseal Keys (need 3 of 5 to unseal):"
          - "{{ vault_creds.unseal_keys_b64 | to_nice_yaml(indent=4) }}"
          - ""
          - "  ACTION REQUIRED:"
          - "    1. Copy the values above to a secure offline location"
          - "       (password manager, encrypted vault, sealed envelope)"
          - "    2. Add 'vault_root_token' and 'vault_unseal_keys' to your"
          - "       group_vars (encrypted with ansible-vault) for re-runs"
          - "    3. These keys will NEVER be displayed again"
          - ""
          - "  WARNING: Unseal keys are NOT stored in Vault by design."
          - "  Lose them and you lose access to all Vault data "
          - "  permanently."
          - "============================================================"
      when: not vault_already_initialized

    - name: "[06.1.8.2] Re-run completion message"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  Vault provisioning completed successfully"
          - "============================================================"
          - "  Mode:    RE-RUN on existing Vault"
          - "  Host:    {{ vault_url }}"
          - "  Action:  Use your stored Root Token to log in via UI or CLI"
          - "           and back up Unseal Keys if needed."
          - "  Login:   {{ vault_url }}/ui"
          - "============================================================"
      when: vault_already_initialized