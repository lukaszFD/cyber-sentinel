site_name: Cyber Sentinel
site_url: https://lukaszfd.github.io/cyber-sentinel/
repo_url: https://github.com/lukaszFD/cyber-sentinel
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    #Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - navigation.footer

plugins:
  - search
  - minify:
      minify_html: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - "Docker Compose": docker-compose.md
  - "n8n Workflow": n8n.md
#  - "Grafana Dashboards": grafana.md
  - Database: database.md
  - Project Releases: releases.md
  - Future Roadmap: future-roadmap.md
  - License & Security :
      - Open Source Policy: license.md
      - Security Policy: security.md

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/lukaszfd84/
      name: My LinkedIn Profile
    - icon: fontawesome/solid/globe
      link: https://lukaszfd.github.io/ICYB_PW/
      name: My Cybersecurity Blog
    - icon: fontawesome/brands/github
      link: https://github.com/lukaszFD
      name: My GitHub Projects

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [ "." ]

copyright: Copyright &copy; 2026 Lukasz Dejko